name: Tests

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        run: composer test

  wordpress-smoke:
    name: Packaged WordPress activation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, zip
          coverage: none
          tools: composer:v2, wp-cli

      - name: Build installable plugin package
        run: php scripts/package-plugin.php

      - name: Verify package contents
        run: php scripts/verify-package.php build/wp-static-secure.zip

      - name: Verify repeated package build is deterministic
        run: |
          cp build/wp-static-secure.zip /tmp/wp-static-secure-first.zip
          php scripts/package-plugin.php
          cmp /tmp/wp-static-secure-first.zip build/wp-static-secure.zip

      - name: Upload plugin package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-static-secure-plugin
          path: build/wp-static-secure.zip
          if-no-files-found: error

      - name: Install WordPress
        env:
          WP_PATH: /tmp/wordpress
        run: |
          wp core download --path="$WP_PATH" --quiet
          wp config create \
            --path="$WP_PATH" \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path="$WP_PATH" \
            --url=http://example.test \
            --title="WP Static Secure CI" \
            --admin_user=admin \
            --admin_password='ci-only-password' \
            --admin_email=ci@example.test \
            --skip-email

      - name: Install and activate packaged plugin
        env:
          WP_PATH: /tmp/wordpress
        run: |
          wp plugin install "$GITHUB_WORKSPACE/build/wp-static-secure.zip" --activate --path="$WP_PATH"
          wp plugin status wp-static-secure --path="$WP_PATH"

      - name: Verify Phase 7 submission reaches Inbox storage
        env:
          WP_PATH: /tmp/wordpress
        run: |
          wp eval '
          global $wpdb;
          $table = $wpdb->prefix . "wpss_submissions";
          if ($wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s", $table)) !== $table) {
              throw new RuntimeException("Submission table was not installed.");
          }
          $store = new WPStaticSecure\Forms\WordPressSubmissionStore($wpdb);
          $definition = new WPStaticSecure\Forms\FormDefinition("contact", ["email", "message"]);
          $endpoint = new WPStaticSecure\Forms\SubmissionEndpoint(
              $store,
              ["http://example.test"],
              [["adapter" => new WPStaticSecure\Forms\GenericHtmlFormAdapter(), "definition" => $definition]]
          );
          $endpoint->submit(
              ["_wpss_form_id" => "contact", "email" => "ci@example.test", "message" => "hello"],
              "http://example.test"
          );
          $rows = $store->list(WPStaticSecure\Forms\SubmissionStatus::NEW);
          if (count($rows) !== 1 || $rows[0]->formId() !== "contact" || $rows[0]->fields()["message"] !== "hello") {
              throw new RuntimeException("Phase 7 submission was not persisted for the Inbox.");
          }
          if (!$store->updateStatus($rows[0]->id(), WPStaticSecure\Forms\SubmissionStatus::DONE)) {
              throw new RuntimeException("Submission status was not updated.");
          }
          if ($store->find($rows[0]->id())?->status() !== WPStaticSecure\Forms\SubmissionStatus::DONE) {
              throw new RuntimeException("Updated submission status was not readable.");
          }
          ' --path="$WP_PATH"
