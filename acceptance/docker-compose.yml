name: wp-static-secure-acceptance

services:
  db:
    image: mariadb:11.4.7
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${WP_HTTP_PORT:-8080}:80"
    volumes:
      - wp_data:/var/www/html

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_SITE_URL: ${WP_SITE_URL}
      WPS_RELEASE_TAG: ${WPS_RELEASE_TAG}
      WPS_RELEASE_ASSET: ${WPS_RELEASE_ASSET}
      WPS_RELEASE_COMMIT: ${WPS_RELEASE_COMMIT}
      WPS_RELEASE_SHA256: ${WPS_RELEASE_SHA256:-}
      WPS_THEME: ${WPS_THEME}
      WPS_THEME_VERSION: ${WPS_THEME_VERSION}
      WPS_CF7_VERSION: ${WPS_CF7_VERSION}
    volumes:
      - wp_data:/var/www/html
      - ./:/acceptance:ro

volumes:
  db_data:
  wp_data:
